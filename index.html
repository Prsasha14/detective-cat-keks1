<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Детектив Кекс: математичні справи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6f4fa; --surface:#ffffff; --surface-2:#f2f8fb; --cream:#fff8e7; --ink:#1c2a37; --muted:#526373;
  --teal:#13998b; --teal-ink:#ffffff; --teal-soft:#d4f2ed; --blue:#2c6cc6; --blue-soft:#dce9fb;
  --gold:#f2b632; --gold-ink:#3a2800; --gold-soft:#fff0c4; --line:#cddce6; --bubble:#ffffff;
  --shadow:0 10px 28px rgba(18,62,92,.13);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a24; --surface:#162533; --surface-2:#1b2d3d; --cream:#28241a; --ink:#edf3f7; --muted:#a8b7c4;
    --teal:#2cc0af; --teal-ink:#04211c; --teal-soft:#123732; --blue:#6ea3ef; --blue-soft:#1a2c45;
    --gold:#f5c24c; --gold-ink:#2a1e00; --gold-soft:#3a3014; --line:#2b3f50; --bubble:#1f3243;
    --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a24; --surface:#162533; --surface-2:#1b2d3d; --cream:#28241a; --ink:#edf3f7; --muted:#a8b7c4;
  --teal:#2cc0af; --teal-ink:#04211c; --teal-soft:#123732; --blue:#6ea3ef; --blue-soft:#1a2c45;
  --gold:#f5c24c; --gold-ink:#2a1e00; --gold-soft:#3a3014; --line:#2b3f50; --bubble:#1f3243;
  --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Roboto,Arial,sans-serif;font-size:clamp(18px,2.1vw,22px);line-height:1.4;font-weight:700;-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{font-family:"Rubik","Nunito","Segoe UI",Arial,sans-serif;margin:0 0 .4em;line-height:1.15}
h1{font-size:clamp(30px,5vw,52px)} h2{font-size:clamp(24px,3vw,32px)} h3{font-size:clamp(20px,2.4vw,24px)}
p{margin:.3em 0 .7em}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:14px clamp(12px,2.4vw,24px) 28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:60px;min-width:60px;padding:10px 22px;border-radius:18px;border:0;background:var(--teal);color:var(--teal-ink);font-weight:900;font-size:clamp(18px,2.1vw,23px);cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.secondary{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.big{min-height:68px;padding:12px 28px;font-size:clamp(20px,2.5vw,26px)}
.btn.small{min-height:46px;font-size:17px;padding:6px 14px;border-radius:14px}
.btn.danger{background:#c2414b;color:#fff}
.btn[disabled]{opacity:.45;cursor:default}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tb-title{display:flex;align-items:center;gap:12px}
.loc-ico{font-size:40px}
.case-name{font-family:"Rubik",sans-serif;font-size:clamp(20px,2.6vw,28px);font-weight:800}
.progress{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:22px}
.dot{width:18px;height:18px;border-radius:50%;background:var(--line);display:inline-block}
.dot.now{background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.dot.done{background:var(--gold)}

.game-grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:920px){.game-grid{grid-template-columns:1.05fr 1fr}.game-grid>.scene{position:sticky;top:12px}}

.scene{position:relative;border-radius:26px;overflow:hidden;height:clamp(270px,42vh,420px);box-shadow:var(--shadow);background:#bfe6f7}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%}
.kex{position:absolute;left:2%;bottom:-2px;width:min(36%,230px)}
.kex svg{width:100%;height:auto;display:block;overflow:visible}
.mood-joy{animation:hop .55s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-14px)}}
.bubble{position:absolute;left:37%;right:3%;top:5%;max-height:62%;overflow:auto;background:var(--bubble);color:var(--ink);padding:12px 16px 12px 18px;border-radius:22px;box-shadow:var(--shadow);font-size:clamp(17px,2vw,21px);display:flex;gap:8px;align-items:flex-start}
.bubble span{flex:1}
.bubble::before{content:"";position:absolute;left:-12px;bottom:18px;border:12px solid transparent;border-right-color:var(--bubble);border-left:0}
.say-btn{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:20px}
.evi-obj{position:absolute;right:7%;bottom:9%;font-size:clamp(46px,7vw,72px);animation:glow 1.8s ease-in-out infinite;filter:drop-shadow(0 0 14px #ffd85c)}
@keyframes glow{50%{filter:drop-shadow(0 0 26px #ffe58a);transform:scale(1.06)}}
.decor{position:absolute;right:3%;bottom:4%;font-size:clamp(30px,4vw,44px);background:rgba(255,255,255,.65);border-radius:16px;padding:2px 10px}

.card{background:var(--cream);border-radius:26px;padding:clamp(16px,2.4vw,26px);box-shadow:var(--shadow)}
.card.plain{background:var(--surface)}
.stage-label{color:var(--muted);font-size:clamp(16px,1.8vw,19px);margin-bottom:6px}
.sim-label{display:inline-block;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:4px 12px;margin-bottom:8px;font-size:18px}
.task-text{font-size:clamp(27px,3.4vw,36px);font-weight:900;line-height:1.3;margin-bottom:14px}
.ans-row{display:flex;justify-content:center}
.answer{font:inherit;font-size:clamp(34px,5vw,46px);font-weight:900;text-align:center;width:100%;max-width:280px;border-radius:18px;border:3px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 10px}
.answer:focus{border-color:var(--teal);outline:none}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:12px auto 4px}
.key{min-height:60px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:none}
.key.blank{visibility:hidden}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:8px 0}
.opt{min-height:66px;border-radius:18px;border:3px solid var(--teal);background:var(--surface);font-size:clamp(20px,2.5vw,26px);font-weight:900;cursor:pointer;padding:8px 12px}
.opt[disabled]{opacity:.35;border-style:dashed;cursor:default}
.order-target{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.slot{min-width:72px;min-height:58px;border-radius:14px;border:3px dashed var(--line);display:grid;place-items:center;padding:6px 12px;font-size:22px;color:var(--muted)}
.slot.filled{border:3px solid var(--gold);background:var(--gold-soft);color:var(--ink);font-weight:900}
.card-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.hint{display:flex;flex-direction:column;gap:2px;background:var(--teal-soft);border-radius:16px;padding:10px 16px;margin-top:10px}
.hint b{font-size:17px;color:var(--muted)}
.hint.lvl3{background:var(--blue-soft)}

.evidence-card{text-align:center}
.ev-big{font-size:86px;line-height:1}
.ev-label{color:var(--muted)}
.ev-text{font-size:clamp(20px,2.4vw,25px)}
.pop{animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.9);opacity:.3}}

.bottombar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;background:var(--surface);border-radius:22px;padding:12px 16px;box-shadow:var(--shadow)}
.bag-wrap{display:flex;align-items:center;gap:10px}
.bag-ico{font-size:40px}
.bag{display:flex;gap:8px;flex-wrap:wrap}
.bag-slot{width:56px;height:56px;border-radius:14px;border:3px dashed var(--line);display:grid;place-items:center;font-size:30px}
.bag-slot.full{border:3px solid var(--gold);background:var(--gold-soft);animation:popin .4s}
.bb-actions{display:flex;gap:10px;flex-wrap:wrap}

.login{max-width:900px}
.hero{display:flex;align-items:center;gap:clamp(12px,3vw,32px);margin:10px 0 18px}
.hero-kex{width:clamp(130px,24vw,220px);flex:none}
.hero h1{color:var(--teal);letter-spacing:-.5px}
.sub{font-family:"Rubik",sans-serif;font-size:clamp(20px,3vw,30px);color:var(--muted);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.text-in{font:inherit;font-size:24px;min-height:60px;padding:8px 16px;border-radius:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);flex:1;min-width:220px}
.chip{min-height:52px;padding:8px 16px;border-radius:26px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800}
.chip.sel{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.note{color:var(--muted);font-size:17px}

.case-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.case-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:22px;padding:16px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;border-top:8px solid var(--teal);min-height:200px}
.case-card.solved{border-top-color:var(--gold)}
.case-card.locked{opacity:.6;border-top-color:var(--line);cursor:default}
.cc-num{color:var(--muted);font-size:16px}
.cc-ico{font-size:44px}
.cc-title{font-family:"Rubik",sans-serif;font-size:22px;font-weight:800;line-height:1.2}
.cc-loc{color:var(--muted);font-size:17px}
.cc-status{margin-top:auto;font-size:17px}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.who-name{font-family:"Rubik",sans-serif;font-size:clamp(22px,3vw,30px);font-weight:800}
.pill{background:var(--surface);border-radius:20px;padding:6px 14px;font-size:18px;border:2px solid var(--line)}
.goal{margin-top:16px;background:var(--surface);border-radius:20px;padding:14px 18px;box-shadow:var(--shadow)}
.goal-bar{height:16px;border-radius:10px;background:var(--line);overflow:hidden;margin-top:8px}
.goal-bar i{display:block;height:100%;background:var(--gold)}

.suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:10px 0}
.suspect{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:12px;cursor:pointer;font-weight:900;font-size:19px;text-align:center}
.suspect.static{cursor:default}
.suspect.dim{opacity:.4}
.sus-emoji{font-size:56px;line-height:1.1}
.suspects.mini .sus-emoji{font-size:42px}
.evlist{margin-top:12px;background:var(--surface);border-radius:16px;padding:10px 14px}
.evlist summary{cursor:pointer;font-weight:900;min-height:44px;display:flex;align-items:center}
.evlist ul{list-style:none;padding:0;margin:6px 0 0}
.evlist li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:18px}
.evlist li>span{font-size:30px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}

.reveal{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 16px;margin:10px 0}
.big-emoji{font-size:64px}
.sum-list{padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.sum-list li{background:var(--gold-soft);border-radius:14px;padding:6px 12px}
.skill{font-size:clamp(19px,2.2vw,23px)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 14px}
.badge span{font-size:30px}
.badge.new{border-color:var(--gold);background:var(--gold-soft);animation:popin .5s}
.badge.off{opacity:.45;filter:grayscale(1)}
.kex-note{background:var(--teal-soft);border-radius:14px;padding:10px 14px}

.journal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:14px}
.jpage{background:var(--cream);border-radius:20px;padding:16px;box-shadow:var(--shadow);border-left:10px solid var(--teal)}
.jpage .jill{font-size:58px}
.jpage .sign{font-family:"Rubik",sans-serif;color:var(--blue);margin-top:8px}
.ranks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.rank{padding:8px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line)}
.rank.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}

.overlay{position:fixed;inset:0;background:rgba(10,25,40,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--ink);border-radius:24px;padding:24px;max-width:560px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;transition:transform .25s;z-index:60;max-width:90vw}
#toast.show{transform:translate(-50%,0)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:30px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg);opacity:0}}

/* Teacher */
.teacher{font-size:18px;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{min-height:50px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800}
.tab.on{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:16px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:900}
.f{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:16px;font-weight:800;color:var(--muted);flex:1;min-width:180px}
.f input,.f textarea,.f select{font:inherit;font-weight:600;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 12px;min-height:46px}
.f textarea{resize:vertical}
.f2,.f3,.frow{display:flex;flex-wrap:wrap;gap:10px}
.f3 .f{min-width:220px}
.panel{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.stage-ed{border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin:14px 0;background:var(--surface-2)}
.stage-ed legend{font-weight:900;padding:0 8px;font-size:19px}
.var-ed{background:var(--surface);border-radius:14px;padding:10px 12px;margin:10px 0;border-left:6px solid var(--blue)}
.var-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.code{width:100%;min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:10px}
.explain{color:var(--muted);font-size:16px}
.check-row{display:flex;align-items:center;gap:10px;margin:8px 0;min-height:44px}
.check-row input{width:26px;height:26px}

/* Простий редактор */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.s-cases{display:flex;flex-wrap:wrap;gap:10px}
.s-case{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:17px;text-align:left}
.s-case span{font-size:26px}
.s-case.on{border-color:var(--teal);background:var(--teal-soft)}
.s-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.s-stage{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px;border-left:8px solid var(--teal)}
.s-num{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--teal);color:var(--teal-ink);font-size:18px;margin-right:4px}
.s-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.s-task{flex:3;min-width:260px}
.s-ans{flex:1;min-width:150px;max-width:240px}
.s-ans input{font-size:24px!important;font-weight:900!important;text-align:center}
.s-f span{color:var(--ink);font-size:17px}
.s-check{border-radius:12px;padding:8px 12px;margin:6px 0;background:var(--surface-2);font-size:17px}
.s-check.ok{background:var(--teal-soft)}
.s-check.warn{background:var(--gold-soft)}
.s-opts{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.s-lbl{font-size:17px;font-weight:800}
.s-opt{display:flex;align-items:center;gap:10px}
.s-opt input[type=radio]{width:26px;height:26px;flex:none}
.s-opt input:not([type]){font:inherit;font-size:18px;font-weight:700;border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-height:46px;background:var(--surface);color:var(--ink);flex:1;max-width:420px}
.s-emo{font-size:30px}
.s-more{margin-top:8px;background:var(--surface-2);border-radius:12px;padding:6px 12px}
.s-more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:800}
@media (max-width:600px){
  .bubble{left:34%;font-size:16px;padding:10px 12px}
  .kex{width:38%}
  .bag-slot{width:46px;height:46px;font-size:24px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .confetti{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script id="kex-shared" type="application/json">null</script>
<script>
'use strict';
/* Знімок вихідного коду сторінки (до будь-яких змін DOM) — для збереження справ для всіх пристроїв */
const PAGE_SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
let SHARED = null; try{ SHARED = JSON.parse(document.getElementById('kex-shared').textContent); }catch(e){}

/* ================= ДАНІ ================= */
const LOC = {
  bureau:{name:'Детективне бюро',icon:'🕵️'},
  park:{name:'Міський парк',icon:'🌳'},
  museum:{name:'Музей',icon:'🏛️'},
  street:{name:'Вулиця Цифроград',icon:'🏘️'},
  library:{name:'Бібліотека',icon:'📚'},
  school:{name:'Школа',icon:'🏫'},
  treasury:{name:'Таємнича скарбниця',icon:'💎'}
};
const DIFFS = ['базова','середня','підвищена'];
const TYPES = {number:'Приклад / задача (число)', choice:'Вибір із варіантів', order:'Впорядкування карток'};
const V = (difficulty,type,task,answers,hints,extra={}) => Object.assign({difficulty,type,task,answers,hints,similar:null},extra);
const SIM = (task,answers) => ({task,answers});

const DEFAULT_CASES = [
{

async function publishGitHub(){
  const gi=GH.info(), tok=GH.token(); if(!gi || !tok || PUBLISHING) return;
  PUBLISHING=true; if(IN_TEACHER) renderTeacher(true);
  const rev=Date.now();
  const settings={}; SHARED_KEYS.forEach(k=>{ settings[k]=DB.settings[k]; });
  const body=JSON.stringify({rev, cases:DB.cases, settings, passHash:DB.settings.passHash||null});
  const url=`https://api.github.com/repos/${gi.owner}/${gi.repo}/contents/cases.json`;
  const hdr={'Authorization':'Bearer '+tok, 'Accept':'application/vnd.github+json'};
  try{
    let sha;
    const r0=await fetch(url, {headers:hdr, cache:'no-store'});
    if(r0.ok) sha=(await r0.json()).sha; else if(r0.status!==404) throw {status:r0.status};
    const r=await fetch(url, {method:'PUT', headers:{...hdr,'Content-Type':'application/json'}, body:JSON.stringify({message:'Оновлення справ гри «Детектив Кекс»', content:b64utf8(body), sha})});

function tone(freqs, dur=0.12){
  if(!DB.settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f,i)=>{ const o=actx.createOscillator(), gn=actx.createGain(); o.type='sine'; o.frequency.value=f;
      gn.gain.setValueAtTime(0.0001,t+i*dur); gn.gain.exponentialRampToValueAtTime(0.16,t+i*dur+0.02); gn.gain.exponentialRampToValueAtTime(0.0001,t+i*dur+dur*1.7);
      o.connect(gn).connect(actx.destination); o.start(t+i*dur); o.stop(t+i*dur+dur*1.9); });
  }catch(e){}
}

function speak(text){
  if(!('speechSynthesis' in window)) { toast('Цей браузер не вміє озвучувати текст'); return; }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(speakable(text)); u.lang='uk-UA'; const uv=speechSynthesis.getVoices().find(v=>/^uk/i.test(v.lang)); if(uv) u.voice=uv; u.rate=0.95; speechSynthesis.speak(u); }catch(e){}
}
function autoSpeak(){ if(DB.settings.autoVoice && SAY) speak(SAY); }
function stopSpeak(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }

function scene(loc, mood, say, objIcon, extraHTML=''){
  SAY = say || '';
  return `<div class="scene">${sceneBG(loc)}<div class="kex">${kexSVG(mood)}</div>${say?`<div class="bubble" aria-live="polite"><span>${esc(say)}</span><button class="say-btn" data-act="speakBubble" aria-label="Озвучити репліку Кекса">🔊</button></div>`:''}${objIcon?`<div class="evi-obj" aria-hidden="true">${objIcon}</div>`:''}${extraHTML}</div>`;
}

const app = document.getElementById('app');
function show(html, keepScroll){ app.innerHTML = html; if(!keepScroll) window.scrollTo(0,0); }
function modal(html){ document.getElementById('modal-root').innerHTML = `<div class="overlay" data-act="overlayClick"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector('.modal input,.modal button'); if(f) f.focus(); }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function toast(t){ let el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el);} el.textContent=t; el.className='show'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.className='',2400); }
function confetti(){ return `<div class="confetti" aria-hidden="true">${Array.from({length:20},()=>`<span style="left:${(Math.random()*100).toFixed(1)}%;animation-delay:${(Math.random()*.7).toFixed(2)}s">${pick(['⭐','✨','🪙','🎉','🐾'])}</span>`).join('')}</div>`; }

function renderLogin(){
  IN_TEACHER=false; ME=null; RUN=null; LOGIN_G='m'; LOGIN_G_TOUCHED=false;
  const mode=DB.settings.mode;
  const names = DB.settings.roster.length ? DB.settings.roster : Object.values(DB.students).map(s=>s.name);
  const quick = names.length ? `<p class="note">Обери себе зі списку або впиши ім’я:</p><div class="chips">${names.map(n=>`<button class="chip" data-act="quickLogin" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : '';
  const genders = mode==='у парах'
    ? `<button class="chip sel" data-act="gender" data-g="p">Ми — пара напарників</button>`
    : `<button class="chip sel" data-act="gender" data-g="m">Я напарник</button><button class="chip" data-act="gender" data-g="f">Я напарниця</button>`;
  if(mode==='у парах') LOGIN_G='p';
  const front = mode==='фронтальний'
    ? `<div class="card plain" style="margin-bottom:16px"><h2>Детективна хвилинка всім класом</h2><p>Справа відкриється на дошці, а відповідь вводить учитель.</p><button class="btn big" data-act="classLogin">Почати всім класом 🔍</button></div>` : '';
  show(`<div class="wrap login">
    <div class="hero"><div class="hero-kex">${kexSVG('joy')}</div><div><h1>Детектив Кекс</h1><p class="sub">математичні справи</p></div></div>
    ${front}
    <div class="card">
      <h2>${mode==='у парах'?'Як вас звати, напарники?':'Як тебе звати, напарнику?'}</h2>
      ${quick}
      <div class="row"><input id="nm" class="text-in" maxlength="30" autocomplete="off" placeholder="${mode==='у парах'?'Наприклад: Оля і Петро':'Ім’я або псевдонім'}" aria-label="Ім’я"><button class="btn big" data-act="login">Увійти</button></div>
      <div class="row">${genders}</div>
      <p class="note">Лише ім’я або псевдонім — без прізвища.</p>
    </div>
    <div class="row" style="margin-top:18px"><button class="btn secondary small" data-act="teacherOpen">🔒 Кабінет учителя</button></div>
  </div>`);
  const nm=document.getElementById('nm'); if(nm) nm.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(nm.value); });
}
function doLogin(name){
  name=String(name||'').trim().replace(/\s+/g,' ').slice(0,30);
  if(!name){ toast('Впиши ім’я або псевдонім'); return; }
  const key=name.toLowerCase();
  let st=DB.students[key];
  if(!st){ st=newStudent(name,LOGIN_G); DB.students[key]=st; }
  else if(LOGIN_G_TOUCHED || DB.settings.mode==='у парах') st.gender=LOGIN_G;
  st.sessions=(st.sessions||0)+1; st.lastSeen=Date.now();
  ME=st; saveDB(); renderBureau();
}

/* ================= БЮРО ================= */
function classProgress(){
  const total=Object.values(DB.students).reduce((a,s)=>a+totalSolves(s),0);
  const goal=Math.max(1,DB.settings.classGoal|0||8);
  const tiers=Math.min(CLASS_ITEMS.length,Math.floor(total/goal));
  return {total,goal,items:CLASS_ITEMS.slice(0,tiers),next:(tiers+1)*goal,maxed:tiers>=CLASS_ITEMS.length};
}
function renderBureau(){
  RUN=null; clearTimeout(IDLE); stopSpeak();
  const n=solvedCount(), cls=classProgress();
  const decor = cls.items.length ? `<div class="decor" title="Нагороди класу">${cls.items.map(i=>i.split(' ')[0]).join(' ')}</div>` : '';
  const cards = DB.cases.map((c,i)=>{
    const locked=!caseUnlocked(c), solved=ME.solved[c.id], prog=ME.progress[c.id];
    const status = locked ? `🔒 Відкриється ${unlockText(c.unlockAfter||0)}` : solved ? `✅ Розкрито · ${c.badgeIcon} ${esc(c.badge)}` : prog ? `⏳ Етап ${Math.min(prog.stageIdx+1,c.stages.length)} з ${c.stages.length}` : '🆕 Нова справа';
    const loc=LOC[c.location]||LOC.park;
    return `<button class="case-card ${locked?'locked':''} ${solved?'solved':''}" data-act="openCase" data-id="${c.id}" ${locked?'aria-disabled="true"':''}><span class="cc-num">Справа ${i+1}</span><span class="cc-ico">${loc.icon}</span><span class="cc-title">${esc(c.title)}</span><span class="cc-loc">${loc.name}</span><span class="cc-status">${status}</span></button>`;
  }).join('');
  const pct = cls.maxed ? 100 : Math.round(100*(cls.total-(cls.next-cls.goal))/cls.goal);
  const say = `Привіт, ${addr()}! На нас чекає нова загадкова справа!`;
  show(`<div class="wrap">
    <div class="topbar"><div class="who"><span class="who-name">🕵️ ${esc(ME.name)}</span><span class="pill">${esc(rankOf(n))}</span><span class="pill">⭐ ${totalSolves()}</span></div>
      <div class="row" style="margin:0"><button class="btn secondary" data-act="journal">📒 Журнал</button><button class="btn secondary" data-act="awards">🏅 Нагороди</button><button class="btn secondary" data-act="logout">Вийти</button></div></div>
    ${scene('bureau','neutral',say,'',decor)}
    <h2 style="margin-top:18px">Дошка справ</h2>
    <div class="case-board">${cards}</div>
    <div class="goal"><b>🏫 Спільна справа класу.</b> ${cls.maxed?`Клас зібрав усі предмети для бюро: ${cls.items.join(', ')}!`:`Розкрито ${cls.total} з ${cls.next} — і в бюро з’явиться новий предмет.`}${cls.items.length&&!cls.maxed?` Уже є: ${cls.items.join(', ')}.`:''}<div class="goal-bar"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div></div>
  </div>`);
  autoSpeak();
}

function startCase(id,resume,preview=false){
  const c=getCase(id); if(!c) return;
  const st=statsOf(id); st.starts++;
  if(ME.solved[id] && !preview) ME.replays=(ME.replays||0)+1;
  const prog = resume ? ME.progress[id] : null;
  if(!resume) delete ME.progress[id];
  RUN={caseId:id,c,stageIdx:prog?prog.stageIdx:0,found:prog?prog.stageIdx:0,errorsTotal:prog?prog.errors:0,hintsCase:prog?prog.hints:0,persisted:prog?!!prog.persisted:false,segStart:Date.now(),preview,wrongSus:[],explainMsg:''};
  if(!preview) saveDB();
  if(RUN.stageIdx>=c.stages.length) goFinale(); else loadStage();
}
function loadStage(){
  const s=RUN.c.stages[RUN.stageIdx];
  const want=(RUN.preview&&PREVIEW_DIFF)||DB.settings.difficulty; let pool=s.variants.filter(x=>x.difficulty===want); if(!pool.length) pool=s.variants;
  RUN.v=pick(pool);
  Object.assign(RUN,{errors:0,hintLevel:0,phase:'task',simErr:0,showSimAnswer:false,draft:'',dimmed:[],orderSel:[]});
  if(RUN.v.type==='order'){ let sh=shuffle(RUN.v.items), guard=0; while(sh.join('|')===RUN.v.items.join('|') && guard++<12) sh=shuffle(RUN.v.items); RUN.shuffled=sh; }
  RUN.mood='attentive';
  RUN.say = RUN.stageIdx===0 ? `Почнімо, ${addr()}! Перший доказ — «${s.evidence}».` : pick(['Ось наступний доказ. Поглянь уважно!','Ми на правильному шляху! Що тут у нас?','Гм… Цікаво. Розгадаймо й це!']);
  renderStage(); autoSpeak();
}
function topbarGame(c){
  const total=c.stages.length;
  const dots=c.stages.map((_,i)=>`<span class="dot ${(i<RUN.stageIdx||(i===RUN.stageIdx&&RUN.phase==='evidence')||RUN.stageIdx>=total)?'done':(i===RUN.stageIdx?'now':'')}"></span>`).join('');
  const loc=LOC[(c.stages[Math.min(RUN.stageIdx,total-1)]||{}).location||c.location]||LOC.park;
  return `<div class="topbar"><div class="tb-title"><span class="loc-ico" aria-hidden="true">${loc.icon}</span><div><div class="case-name">${esc(c.title)}${RUN.preview?' (перегляд)':''}</div><div class="progress" aria-label="Етап ${Math.min(RUN.stageIdx+1,total)} з ${total}">🔍 ${dots}</div></div></div><button class="btn secondary" data-act="pause">⏸ Пауза</button></div>`;
}
function hintsHTML(v){
  const labels=['🔍 Навідне запитання','🧩 Перший крок','📖 Розв’язання'];
  let h=''; for(let i=0;i<RUN.hintLevel;i++) h+=`<div class="hint ${i===2?'lvl3':''}"><b>${labels[i]}</b><span>${esc(fill(hintText(v,i)))}</span></div>`;

}
function keypad(time){

function taskCard(s,v){

}
function bagHTML(){
  const c=RUN.c;

}
function renderStage(keep){
  const c=RUN.c, s=c.stages[RUN.stageIdx], v=RUN.v, loc=s.location||c.location;
  const card = RUN.phase==='evidence'
    ? `<div class="card evidence-card pop"><div class="ev-big">${s.icon}</div><div class="ev-label">Доказ знайдено</div><h2>${esc(s.evidence)}</h2><p class="ev-text">${esc(fill(s.result))}</p><div class="card-actions" style="justify-content:center"><button class="btn big" data-act="nextStage">${RUN.stageIdx+1<c.stages.length?'Далі ➜':'До розгадки ➜'}</button></div></div>`
    : taskCard(s,v);
  show(`<div class="wrap">${topbarGame(c)}<div class="game-grid">${scene(loc,RUN.mood,RUN.say,RUN.phase==='evidence'?'':s.icon)}${card}</div>${bagHTML()}</div>`, keep);

  if(inp){ inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } }); if(!keep || window.matchMedia('(min-width:920px)').matches) inp.focus({preventScroll:true}); }

function armIdle(){
  clearTimeout(IDLE);
  if(!RUN || RUN.phase!=='task' || RUN.hintLevel>0) return;
  IDLE=setTimeout(()=>{
    if(!RUN || RUN.phase!=='task' || RUN.hintLevel>0 || document.querySelector('.overlay')) return;
    raiseHint(1,'auto'); RUN.mood='thinking'; RUN.say='Гм… Давай подумаємо разом. Глянь на підказку.';
    renderStage(true); autoSpeak();
  },60000);
}
function raiseHint(lvl,src){
  if(lvl<=RUN.hintLevel) return;
  const d=lvl-RUN.hintLevel; RUN.hintLevel=lvl; RUN.hintsCase+=d;
  const st=statsOf(RUN.caseId); if(src==='lupa') st.hintsLupa+=d; else st.hintsAuto+=d;
}
function check(){
  if(!RUN || (RUN.phase!=='task'&&RUN.phase!=='similar')) return;
  const v=RUN.v, sim=RUN.phase==='similar';
  if(v.type==='order' && !sim){
    if(RUN.orderSel.length<v.items.length){ RUN.say='Розклади всі картки, а тоді перевіримо.'; RUN.mood='attentive'; return renderStage(true); }
    const given=RUN.orderSel.map(i=>RUN.shuffled[i]).join('|');
    return given===v.items.join('|') ? onCorrect() : onWrong();
  }
  const inp=document.getElementById('ans'); const val=inp?inp.value:RUN.draft;
  if(!String(val).trim()){ RUN.say='Спершу впиши відповідь. Я зачекаю!'; RUN.mood='neutral'; return renderStage(true); }
  const answers=(sim?v.similar.answers:v.answers)||[];
  answers.map(norm).includes(norm(val)) ? onCorrect() : onWrong();
}
function onCorrect(){
  clearTimeout(IDLE);
  const s=RUN.c.stages[RUN.stageIdx], st=statsOf(RUN.caseId);
  st.stageErrors[s.evidence]=(st.stageErrors[s.evidence]||0)+RUN.errors;
  if(RUN.errors>=2) RUN.persisted=true;
  RUN.phase='evidence'; RUN.found=RUN.stageIdx+1; RUN.draft=''; RUN.mood='joy';
  RUN.say = RUN.errors>=2
    ? `${g('Ти не здався','Ти не здалася','Ви не здалися')} — і доказ у сумці! Оце наполегливість!`
    : pick([`Чудово! ${g('Ти знайшов','Ти знайшла','Ви знайшли')} важливий доказ!`, `Точно! ${g('Ти уважно рахував','Ти уважно рахувала','Ви уважно рахували')}. Доказ у сумці!`, 'Так! Ще один крок до розгадки!']);
  sfx.ok(); saveProgress(); renderStage(true); autoSpeak();
}
function onWrong(){
  const st=statsOf(RUN.caseId);
  RUN.errors++; RUN.errorsTotal++; st.errors++; sfx.soft(); RUN.draft='';
  if(RUN.phase==='similar'){
    RUN.simErr++; RUN.mood='support';
    if(RUN.simErr>=2){ RUN.showSimAnswer=true; RUN.say='Нічого страшного! Поглянь на відповідь — і йдемо далі.'; }
    else RUN.say='Гм, не збігається. Поглянь на розв’язання вище й спробуй ще.';
    return renderStage(true);
  }
  const lvl=Math.min(RUN.errors,3);
  raiseHint(lvl,'auto');
  if(lvl===1){ RUN.mood='support'; RUN.say='Гм, не збігається. Давай уважно перевіримо підказку.'; }
  else if(lvl===2){ RUN.mood='support'; RUN.say='Помилятися — це нормально. Ось перший крок!'; }
  else {
    RUN.mood='attentive';
    if(simOK(RUN.v)){ RUN.phase='similar'; RUN.say='Розберімо разом крок за кроком. А тепер — схоже завдання!'; }
    else RUN.say='Розберімо разом крок за кроком. Тепер спробуй ще раз.';
  }
  renderStage(true); autoSpeak();
}

function solveCase(logic){

function studentSummary(st){
  let solves=0,errors=0,ha=0,hl=0,time=0,tries=0,logic=0; const stageErr=[];
  for(const [cid,s] of Object.entries(st.stats||{})){
    solves+=s.solves; errors+=s.errors; ha+=s.hintsAuto; hl+=s.hintsLupa; time+=s.timeMs; tries+=s.culpritTries||0; if(s.logic) logic++;
    const c=getCase(cid);
    for(const [k,n] of Object.entries(s.stageErrors||{})) if(n>0) stageErr.push([`${c?c.title:cid}: ${k}`,n]);
  }
  stageErr.sort((a,b)=>b[1]-a[1]);
  return {name:st.name,unique:solvedCount(st),solves,errors,ha,hl,min:Math.round(time/60000),sessions:st.sessions||0,replays:st.replays||0,logic,tries,hard:stageErr.slice(0,3)};
}

/* ---- редактор ---- */
function fInput(label,path,val,o={}){
  const v=o.list?(val||[]).join('; '):(val??'');
  const attrs=`data-path="${path}" ${o.list?'data-list="1"':''} ${o.num?'data-num="1" type="number" min="0"':''}`;
  return `<label class="f"><span>${label}</span>${o.area?`<textarea ${attrs} rows="2">${esc(v)}</textarea>`:`<input ${attrs} value="${esc(v)}">`}</label>`;
}
function fSel(label,path,val,pairs,rerender){
  return `<label class="f" style="flex:0 1 auto"><span>${label}</span><select data-path="${path}" ${rerender?'data-rerender="1"':''}>${pairs.map(([k,l])=>`<option value="${esc(k)}" ${k===val?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
}
function locPairs(withEmpty){ return (withEmpty?[['','— як у справі —']]:[]).concat(Object.entries(LOC).filter(([k])=>k!=='bureau').map(([k,l])=>[k,`${l.icon} ${l.name}`])); }
function ensureEdit(){

}

/* ---- простий редактор ---- */
let SED_DIFF=null, ADV=false, DIRTY=false, PREVIEW_DIFF=null;
const toTok=s=>String(s||'').replace(/\{addr\}/g,'[напарник]').replace(/\{тобі\}/g,'[тобі]');
const fromTok=s=>String(s||'').replace(/\[напарни[а-яіїєґ’']*\]/gi,'{addr}').replace(/\[тобі\]/gi,'{тобі}');
function markDirty(on=true){ DIRTY=on; const n=document.getElementById('dirtyNote'); if(n) n.textContent=on?'Є незбережені зміни':''; }
function sText(label,path,val,{area=true,tok=false}={}){
  const v=tok?toTok(val):(val??'');
  const attrs=`data-path="${path}" ${tok?'data-tok="1"':''}`;
  return `<label class="f s-f"><span>${label}</span>${area?`<textarea ${attrs} rows="2">${esc(v)}</textarea>`:`<input ${attrs} value="${esc(v)}">`}</label>`;
}
function findExpr(t){
  const m=String(t||'').match(/[\d(][\d\s+\-−×*:·/()]*[\d)]/g)||[];
  let best=null;
  for(const raw of m){
    const x=raw.trim();
    if(!/[\d)]\s*[+\-−×*:·/]\s*[\d(]/.test(x)) continue;
    const js=x.replace(/[×·]/g,'*').replace(/:/g,'/').replace(/−/g,'-');
    if(!/^[\d\s+\-*/().]+$/.test(js)) continue;
    try{ const val=Function('"use strict";return ('+js+')')(); if(isFinite(val) && (!best || x.length>best.text.length)) best={text:x,val}; }catch(e){}
  }
  return best;
}
function exprCheck(va,si,vi){
  if(va.type!=='number') return '';
  const ans=(va.answers||[])[0]||'';
  if(String(ans).includes(':')) return `<div class="s-check">🕒 Завдання на час. Відповідь пишіть так, як учень набере її на клавіатурі, наприклад 15:05.</div>`;
  const e=findExpr(va.task); if(!e) return '';
  const r=Math.round(e.val*100)/100;
  if(!String(ans).trim()) return `<div class="s-check warn">🧮 Гра порахувала: ${esc(e.text)} = ${r}. Впишіть правильну відповідь.</div><button class="btn secondary small" data-act="sUseCalc" data-s="${si}" data-v="${vi}" data-r="${r}">Записати ${r} у відповідь</button>`;
  return norm(ans)===norm(String(r))
    ? `<div class="s-check ok">✅ Перевірено: ${esc(e.text)} = ${r}. Відповідь правильна.</div>`
    : `<div class="s-check warn">⚠️ Гра порахувала: ${esc(e.text)} = ${r}, а у відповіді записано ${esc(ans)}. Перевірте, будь ласка.</div><button class="btn secondary small" data-act="sUseCalc" data-s="${si}" data-v="${vi}" data-r="${r}">Записати ${r} у відповідь</button>`;
}

const GEN={
  add_nc:{label:'Двоцифрове + двоцифрове без переходу через десяток',make(){ const a1=rnd(1,7),a2=rnd(0,8),b1=rnd(1,8-a1),b2=rnd(0,9-a2),a=a1*10+a2,b=b1*10+b2; return {task:`${a} + ${b} = ?`,ans:a+b,hints:['Додай окремо десятки й окремо одиниці.',`Десятки: ${a1*10} + ${b1*10} = ${(a1+b1)*10}. Одиниці: ${a2} + ${b2} = ${a2+b2}.`,`${(a1+b1)*10} + ${a2+b2} = ${a+b}.`]}; }},
  sub_nc:{label:'Двоцифрове − двоцифрове без переходу через десяток',make(){ const a1=rnd(3,9),b1=rnd(1,a1-1),a2=rnd(1,9),b2=rnd(0,a2),a=a1*10+a2,b=b1*10+b2; return {task:`${a} − ${b} = ?`,ans:a-b,hints:['Відніми окремо десятки й окремо одиниці.',`Десятки: ${a1*10} − ${b1*10} = ${(a1-b1)*10}. Одиниці: ${a2} − ${b2} = ${a2-b2}.`,`${(a1-b1)*10} + ${a2-b2} = ${a-b}.`]}; }},
  add_c:{label:'Двоцифрове + двоцифрове з переходом через десяток',make(){ const a2=rnd(2,9),b2=rnd(10-a2,9),a1=rnd(1,6),b1=rnd(1,8-a1),a=a1*10+a2,b=b1*10+b2; return {task:`${a} + ${b} = ?`,ans:a+b,hints:['Спершу додай десятки, а потім одиниці.',`${a} + ${b1*10} = ${a+b1*10}. Тепер додай ${b2}.`,`${a+b1*10} + ${b2} = ${a+b}.`]}; }},
  mul:{label:'Табличне множення',make(){ const a=rnd(2,9),b=rnd(2,9); return {task:`${a} × ${b} = ?`,ans:a*b,hints:[`Згадай таблицю множення на ${a}.`,`${a} × ${b} — це ${b} разів по ${a}.`,`${a} × ${b} = ${a*b}.`]}; }},
  div:{label:'Табличне ділення',make(){ const b=rnd(2,9),q=rnd(2,9),a=b*q; return {task:`${a} : ${b} = ?`,ans:q,hints:[`Яке число треба помножити на ${b}, щоб отримати ${a}?`,`${b} × ? = ${a}`,`${a} : ${b} = ${q}, бо ${b} × ${q} = ${a}.`]}; }},
  mixed:{label:'Вираз із двома діями (множення і віднімання)',make(){ const a=rnd(2,9),b=rnd(2,9),c=rnd(1,a*b-1); return {task:`${a} × ${b} − ${c} = ?`,ans:a*b-c,hints:['Що виконуємо першим — множення чи віднімання?',`${a} × ${b} = ${a*b}. Тепер ${a*b} − ${c} = ?`,`${a*b} − ${c} = ${a*b-c}.`]}; }}
};
function validateCase(c){
  const errs=[];
  if(!String(c.title||'').trim()) errs.push('Немає назви справи.');
  if(!c.stages.length) errs.push('Потрібен хоча б один етап.');
  c.stages.forEach((s,i)=>{
    if(!String(s.evidence||'').trim()) errs.push(`Етап ${i+1}: немає назви доказу.`);
    if(!s.variants.length) errs.push(`Етап ${i+1}: немає жодного варіанта завдання.`);
    s.variants.forEach((va,j)=>{
      const t=`Етап ${i+1} (${va.difficulty} рівень)`;
      if(!String(va.task||'').trim()) errs.push(`${t}: немає тексту завдання.`);
      if(va.type==='number'&&!(va.answers||[]).length) errs.push(`${t}: немає правильної відповіді.`);
      if(va.type==='choice'){ if((va.options||[]).length<2) errs.push(`${t}: потрібно щонайменше 2 варіанти відповіді.`); else if(!(va.answers||[]).length||!va.answers.every(a=>va.options.includes(a))) errs.push(`${t}: позначте правильний варіант відповіді.`); }
      if(va.type==='order'&&(va.items||[]).length<2) errs.push(`${t}: потрібно щонайменше 2 картки.`);
      if(va.similar&&va.similar.task&&!(va.similar.answers||[]).length) errs.push(`${t}: у схожого завдання немає відповіді.`);
    });
  });
  if(c.finale.type==='suspect'){ if((c.finale.suspects||[]).length<2) errs.push('Потрібно щонайменше 2 підозрюваних.'); else if(!c.finale.suspects.some(s=>s.id===c.finale.culprit)) errs.push('Оберіть винуватця.'); }
  return errs;
}
function tidyCase(c){
  c.stages.forEach(s=>{ if(!s.location) delete s.location; s.variants.forEach(va=>{ if(va.similar&&!String(va.similar.task||'').trim()) va.similar=null; if(va.type==='choice') va.options=va.options||[]; if(va.type==='order'){ va.items=va.items||[]; va.answers=[]; } }); });
  if(c.finale.type==='suspect'){ c.finale.suspects=c.finale.suspects||[]; c.finale.fakeProofs=c.finale.fakeProofs||[]; }
  return c;
}

  const i=DB.cases.findIndex(x=>x.id===EDIT_ID); if(i>=0) DB.cases[i]=clone(EDIT); markShared(); markDirty(false); return true;
}

function readField(t){ let val=t.value; if(t.dataset.ans){ const v=val.trim(); return v ? (v.includes(':')?[v,v.replace(':','')]:[v]) : []; } if(t.dataset.tok) return fromTok(val); if(t.dataset.list) val=val.split(';').map(s=>s.trim()).filter(Boolean); if(t.dataset.num) val=Math.max(0,parseInt(val,10)||0); return val; }

    renderTeacher(true); toast(`Додано прикладів: ${n}. Не забудьте зберегти справу`); },
  async setSave(){ const s=DB.settings; s.difficulty=document.getElementById('sDiff').value; s.mode=document.getElementById('sMode').value; s.classGoal=Math.max(1,parseInt(document.getElementById('sGoal').value,10)||8);
    s.roster=document.getElementById('sRoster').value.split('\n').map(x=>x.trim().slice(0,30)).filter(Boolean); s.sound=document.getElementById('sSound').checked; s.autoVoice=document.getElementById('sVoice').checked; s.unlockAll=document.getElementById('sUnlock').checked;
    const p=document.getElementById('sPass').value; if(p){ s.password=p; s.passHash=await sha256(p); } markShared(); toast('Налаштування збережено'); renderTeacher(true); },
  restoreCases(){ modal(`<h2>Відновити стандартні справи?</h2><p>П’ять справ із концепції повернуться до початкового вигляду. Ваші власні справи-копії залишаться.</p><div class="modal-actions"><button class="btn" data-act="restoreYes">Відновити</button><button class="btn secondary" data-act="closeModal">Скасувати</button></div>`); },
  restoreYes(){ DEFAULT_CASES.forEach(d=>{ const i=DB.cases.findIndex(x=>x.id===d.id); if(i>=0) DB.cases[i]=clone(d); else DB.cases.push(clone(d)); }); markShared(); EDIT=null; closeModal(); renderTeacher(); toast('Стандартні справи відновлено'); },
  resetAll(){ modal(`<h2>Видалити всі дані?</h2><p>Зникнуть статистика всіх учнів, налаштування й змінені справи. Цю дію не можна скасувати.</p><div class="modal-actions"><button class="btn danger" data-act="resetAllYes">Видалити все</button><button class="btn secondary" data-act="closeModal">Скасувати</button></div>`); },
  resetAllYes(){ DB=freshDB(); markShared(); EDIT=null; closeModal(); renderLogin(); toast('Усі дані видалено'); },
  delStudent(el){ const st=DB.students[el.dataset.k]; if(!st) return; modal(`<h2>Видалити дані учня «${esc(st.name)}»?</h2><div class="modal-actions"><button class="btn danger" data-act="delStudentYes" data-k="${esc(el.dataset.k)}">Видалити</button><button class="btn secondary" data-act="closeModal">Скасувати</button></div>`); },
  delStudentYes(el){ delete DB.students[el.dataset.k]; saveDB(); closeModal(); renderTeacher(true); },
  copyText(el){ const box=document.getElementById(el.dataset.src); if(!box) return; const done=()=>toast('Скопійовано');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(done,()=>{ box.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Виділіть текст і скопіюйте вручну'); } });
    else { box.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Виділіть текст і скопіюйте вручну'); } } },
  importCase(){ const raw=document.getElementById('impBox').value.trim(); if(!raw){ toast('Вставте код справи'); return; }
    let c; try{ c=JSON.parse(raw); }catch(e){ toast('Код справи пошкоджений — скопіюйте його ще раз'); return; }
    if(!c||!c.title||!Array.isArray(c.stages)||!c.finale){ toast('Це не схоже на код справи'); return; }
    c.id='c'+Date.now().toString(36); c.unlockAfter=c.unlockAfter||0; if(!LOC[c.location]) c.location='park';
    const errs=validateCase(tidyCase(c)); if(errs.length){ toast('У справі є помилки: '+errs[0]); return; }
    DB.cases.push(c); markShared(); SHARE_ID=c.id; renderTeacher(); toast(`Справу «${c.title}» додано`); }
};
const CHG={
  edSelect(t){ EDIT_ID=t.value; EDIT=clone(getCase(EDIT_ID)); renderTeacher(true); },
  shareSelect(t){ SHARE_ID=t.value; renderTeacher(true); }
};

document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el || el.disabled || el.getAttribute('aria-disabled')==='true' && el.dataset.act!=='openCase') return; const fn=ACT[el.dataset.act]; if(fn) fn(el,e); });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset && t.dataset.path && EDIT && TTAB==='cases'){ setPath(EDIT,t.dataset.path,readField(t)); markDirty(); }
  if(t.dataset && t.dataset.chk && EDIT){ const [si,vi]=t.dataset.chk.split('.').map(Number); const box=document.getElementById('chk-'+si); if(box) box.innerHTML=exprCheck(EDIT.stages[si].variants[vi],si,vi); }
  if(t.dataset && t.dataset.opt && EDIT){ const [si,vi,k]=t.dataset.opt.split('.').map(Number); const va=EDIT.stages[si].variants[vi]; const was=(va.answers||[])[0]===va.options[k]; va.options[k]=t.value; if(was) va.answers=[t.value]; markDirty(); }
  if(t.id==='ans' && RUN){ RUN.draft=t.value; armIdle(); } });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset && t.dataset.path && EDIT && TTAB==='cases'){ setPath(EDIT,t.dataset.path,readField(t));
    if(t.dataset.rerender){ if(t.dataset.path==='finale.type' && EDIT.finale.type==='suspect'){ EDIT.finale.suspects=EDIT.finale.suspects&&EDIT.finale.suspects.length?EDIT.finale.suspects:[{id:'s1',emoji:'🦊',name:'Підозрюваний 1'},{id:'s2',emoji:'🐻',name:'Підозрюваний 2'}]; EDIT.finale.culprit=EDIT.finale.culprit||EDIT.finale.suspects[0].id; EDIT.finale.fakeProofs=EDIT.finale.fakeProofs||[]; } renderTeacher(true); } }
  if(t.dataset && t.dataset.correct && EDIT){ const [si,vi,k]=t.dataset.correct.split('.').map(Number); const va=EDIT.stages[si].variants[vi]; va.answers=[va.options[k]]; markDirty(); }
  if(t.dataset && t.dataset.culprit && EDIT){ EDIT.finale.culprit=t.dataset.culprit; markDirty(); }
  if(t.dataset && t.dataset.change && CHG[t.dataset.change]) CHG[t.dataset.change](t); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.querySelector('.overlay') && !document.querySelector('[data-act="resumePause"]')) closeModal(); });
window.addEventListener('pagehide',()=>{ if(RUN && !RUN.preview) accTime(); });
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){} }

(async function boot(){ await loadRemote(); let s=null; try{ s=JSON.parse(sessionStorage.getItem('kexTeacher')||'null'); sessionStorage.removeItem('kexTeacher'); }catch(e){}
  if(s && Date.now()-s.t<120000){ TTAB=s.tab||'stats'; EDIT=null; renderTeacher(); } else renderLogin(); })();
</script>
</body>
</html>
